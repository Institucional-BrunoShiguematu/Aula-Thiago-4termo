<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="atividade10.css">
    <title>Document</title>
</head>
<body>
    <table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Preço</th>
      <th>Situação</th>
      <th>Ação</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let produto of produtos; let i = index" [ngStyle]="{
        'color': produto.promocao ? '#dc2626' : '#111827',
        'font-weight': produto.promocao ? 'bold' : 'normal',
    }">
      <td>{{ produto.id }}</td>
      <td>{{ produto.nome }}</td>
      <td>R$ {{ produto.preco}}</td>
      <td>
        <span *ngIf="produto.promocao">{{produto.promocao ? 'Produto em Promoção' : ''}}</span>
      </td>
      <td>
        <button (click)="alterarPromocao(produto)">{{produto.promocao ? 'Desativar Promoção': 'Ativar Promoção'}}</button>
      </td>

    </tr>
  </tbody>
</table>

</body>
</html>
