<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="atividade9.css">
    <title>Document</title>
</head>
<body>
    
    <h2>Produtos em estoque</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Preço</th>
      <th>Quantidade</th>
      <th>Total em estoque</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let produto of produtos; let i = index">
      <td>{{ produto.id }}</td>
      <td>{{ produto.nome }}</td>
      <td>R$ {{ produto.preco}}</td>
      <td>{{ produto.quantidade }}</td>
      <td>R$ {{ calcularTotal(produto)}}</td>
      <td class="classificacao"[ngClass]="{
        'semEstoque':produto.quantidade === 0,
        'baixoEstoque': produto.quantidade > 0 && produto.quantidade <= 5,
        'altoEstoque': produto.quantidade > 5
      }">
      {{classificar(produto.quantidade)}}
    </td>
    </tr>
  </tbody>
</table>

</body>
</html>
